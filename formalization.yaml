limitations:
  - >-
    No novelty is claimed for the formalization beyond the paper it formalizes; the
    mathematics is the paper's.  The paper's result is a lower bound on the worst-case
    side of Erdős's question; the general upper bound (log n)² of Alexeev et al. is not
    formalized and the exact order of f(n) remains open.
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound, and,
    through the Solution only, on the pinned PrimeNumberTheoremAnd development.

acknowledgements: >-
  The prime number theorem input is the MediumPNT theorem of the PrimeNumberTheoremAnd
  project of Alex Kontorovich, Terence Tao and contributors.
