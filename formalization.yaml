fidelity:
  divergences: >-
    The formal statements are those of the paper (Theorem 1.2, displays (4) and (5)),
    with f(n) valued in ℕ∞ so that the paper's convention f(n) = +∞ for an empty
    defining set is literal.  The proof differs from the paper's text in
    simplifications only, all recorded in the README: in Lemma 3.1 only the upper
    bound is needed and it is obtained from θ(K) ≤ (1+o(1))K and the monotonicity of
    x ↦ 1 − log h/log x instead of partial summation, so that the Mertens-type sum
    (10) of the paper is not used; ψ(x) − θ(x) = O(√x) is replaced by Mathlib's
    ψ(x) − θ(x) ≤ 2√x log x; the prefix extraction in Step 3 of Lemma 4.1 is an
    abstract lemma proved by induction on the total depth; the decomposition into the
    ranges (I)–(IV) carries the hypothesis M ≤ K, which the paper uses implicitly;
    and the prime number theorem enters as θ(x) = x + O(x/log² x), weaker than the
    remainder (8) quoted in the paper, and is derived from PrimeNumberTheoremAnd's
    MediumPNT rather than cited.

